<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesman POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .sidebar {
            background-color: #333;
            color: white;
            width: 200px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: width 0.3s;
            overflow-x: hidden;
            z-index: 100;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
        }
        .sidebar a:hover { background-color: #575757; }
        .burger {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: white;
            padding: 10px 20px;
            background: #333;
            border-radius: 4px;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 101;
        }
        .main-content {
            margin-left: 200px;
            padding: 20px;
            flex-grow: 1;
            width: 100%;
            transition: margin-left 0.3s;
        }
        header {
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .pos-section {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .pos-section h2 { margin-bottom: 15px; }
        .additional-info {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .additional-info .input-group {
            flex: 1 1 200px;
            min-width: 200px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .pos-form {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .pos-form label {
            font-weight: bold;
        }
        .pos-form select,
        .pos-form input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .btn:hover { background-color: #218838; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table, th, td { border: 1px solid #ddd; }
        th, td {
            padding: 10px;
            text-align: left;
            font-size: 1rem;
        }
        th { background-color: #f4f4f4; }
        .remove-btn { background-color: #e63946; }
        .payment-info {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .payment-info label { font-weight: bold; margin-right: 10px; }
        .payment-info input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }
        @media (max-width: 600px) {
            .sidebar { width: 0; }
            .burger { display: block; }
            .main-content {
                margin-left: 0;
                padding: 10px;
                width: 100vw;
            }
            .additional-info { flex-direction: column; gap: 10px; }
            header { flex-direction: column; align-items: flex-start; }
            header h1 { margin-bottom: 10px; }
            .pos-form { flex-direction: column; align-items: stretch; }
            .pos-form label,
            .pos-form select,
            .pos-form input,
            .btn { margin-bottom: 10px; }
            .payment-info { align-items: stretch; }
            .payment-info input { width: 100%; }
            table {
                font-size: 14px;
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            th, td { padding: 6px; }
        }
    </style>
</head>
<body>
    <span class="burger" onclick="toggleNav()">☰</span>
    <div class="sidebar" id="sidebar">
        <a href="{% url 'salesman_pos' %}">POS</a>
        <a href="{% url 'salesman_logout' %}">Logout</a>
    </div>
    <div class="main-content">
        <header>
            <h1>Point of Sale</h1>
            <div>Salesman: {{ salesman.name }} ({{ salesman.code }})</div>
        </header>

        <div class="pos-section">
            <h2>New Sale</h2>

            <div class="additional-info">
                <div class="input-group">
                    <label for="warehouse">Warehouse</label>
                    <input type="text" id="warehouse" value="Rahmaniya Pump" readonly>
                </div>
                <div class="input-group">
                    <label for="customerSelect">Customer</label>
                    <select id="customerSelect" onchange="showCustomerInfo()">
                        <option value="">--Select Customer--</option>
                        {% for cust in customers %}
                        <option 
                            value="{{ cust.id }}" 
                            data-due="{{ cust.due }}" 
                            data-advance="{{ cust.Advance }}">
                            {{ cust.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div id="customerInfo" style="margin-top: 10px; font-weight: bold;">
                    <!-- Due and Advance will appear here -->
                </div>
            </div>
            
            <div class="pos-form">
                <label for="productSelect">Product:</label>
                <select id="productSelect">
                    <option value="">--Select Product--</option>
                    {% for product in products %}
                    <option data-id="{{ product.id }}" data-price="{{ product.rate }}">
                        {{ product.name }} - Tk{{ product.rate }}
                    </option>
                    {% endfor %}
                </select>
                <label for="quantityInput">Qty:</label>
                <input type="number" id="quantityInput" min="1" value="1" />
                <button class="btn" onclick="addToCart()">Add to Cart</button>
            </div>
            
            <table id="cartTable">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Less</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cartTableBody">
                    <!-- Items will be dynamically added here -->
                </tbody>
            </table>
            
            <div style="text-align: right; margin-top: 10px;">
                <strong>Grand Total: Tk<span id="grandTotal">0</span></strong>
            </div>
            
            <div class="payment-info">
                <div>
                    <label for="discountInput">Discount %:</label>
                    <input type="number" id="discountInput" min="0" value="0" oninput="calculateDue()">
                </div>
                <div>
                    <label for="lessInput">Less Amount:</label>
                    <input type="number" id="lessInput" min="0" value="0" oninput="calculateDue()">
                </div>
                <div>
                    <label for="paymentInput">Payment:</label>
                    <input type="number" id="paymentInput" min="0" value="0" oninput="calculateDue()">
                </div>
                <div>
                    <strong>Due: Tk<span id="dueAmount">0.00</span></strong>
                </div>
            </div>
            
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn" onclick="submitSale()">Submit for Approval</button>
            </div>
        </div>
    </div>

    <script>
        function toggleNav() {
            var sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            } else {
                sidebar.classList.add('open');
            }
        }

        let cart = [];
        const salesman = {{ salesman.id }};

        function addToCart() {
            const productSelect = document.getElementById('productSelect');
            const quantityInput = document.getElementById('quantityInput');
            const selectedOption = productSelect.options[productSelect.selectedIndex];

            if (!selectedOption || selectedOption.value === "") {
                alert('Please select a product.');
                return;
            }
            
            const productName = selectedOption.text;
            const price = parseFloat(selectedOption.getAttribute('data-price'));
            const quantity = parseInt(quantityInput.value);
            const less = 0; // default less per product
            const total = price * quantity - less;
            const id = selectedOption.getAttribute('data-id');

            cart.push({ product: productName, price, quantity, less, total, id });
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartTableBody');
            tbody.innerHTML = '';
            let grandTotal = 0;

            cart.forEach((item, index) => {
                const rowTotal = item.price * item.quantity - (item.less || 0);
                grandTotal += rowTotal;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.product}</td>
                    <td>${item.price}</td>
                    <td>${item.quantity}</td>
                    <td>
                        <input type="number" min="0" value="${item.less || 0}" style="width:60px"
                            onchange="updateLess(${index}, this.value)">
                    </td>
                    <td>${rowTotal}</td>
                    <td><button class="btn remove-btn" onclick="removeFromCart(${index})">Remove</button></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('grandTotal').textContent = grandTotal;
            calculateDue();
        }

        function updateLess(index, value) {
            cart[index].less = parseFloat(value) || 0;
            cart[index].total = cart[index].price * cart[index].quantity - cart[index].less;
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function calculateDue() {
            let grandTotal = 0;
            cart.forEach(item => {
                grandTotal += item.price * item.quantity - (item.less || 0);
            });
            document.getElementById('grandTotal').textContent = grandTotal;

            const discountPercentage = parseFloat(document.getElementById('discountInput').value) || 0;
            const lessAmount = parseFloat(document.getElementById('lessInput').value) || 0;
            const discountAmount = grandTotal * discountPercentage / 100;
            const discountedTotal = grandTotal - discountAmount - lessAmount;
            const payment = parseFloat(document.getElementById('paymentInput').value) || 0;
            const due = discountedTotal - payment;
            document.getElementById('dueAmount').textContent = due.toFixed(2);
        }

        function showCustomerInfo() {
            const select = document.getElementById('customerSelect');
            const infoDiv = document.getElementById('customerInfo');
            const selected = select.options[select.selectedIndex];
            if (selected && selected.value) {
                const due = selected.getAttribute('data-due') || 0;
                const advance = selected.getAttribute('data-advance') || 0;
                infoDiv.innerHTML = `Due: Tk ${parseFloat(due).toFixed(2)} &nbsp; | &nbsp; Advance: Tk ${parseFloat(advance).toFixed(2)}`;
            } else {
                infoDiv.innerHTML = '';
            }
        }

        function submitSale() {
            if (cart.length === 0) {
                alert('Your cart is empty.');
                return;
            }

            const customer = document.getElementById('customerSelect').value;
            if (!customer) {
                alert('Please select a customer');
                return;
            }

            const discount = parseFloat(document.getElementById('discountInput').value) || 0;
            const less = parseFloat(document.getElementById('lessInput').value) || 0;
            const payment_received = parseFloat(document.getElementById('paymentInput').value) || 0;
            let total_price = 0;
            cart.forEach(item => {
                total_price += item.price * item.quantity - (item.less || 0);
            });
            const due = parseFloat(document.getElementById('dueAmount').textContent) || 0;

            const saleData = {
                salesman: salesman,
                customer: customer,
                products: cart,
                total_price: total_price,
                discount: discount,
                less: less,
                payment_received: payment_received,
                due: due
            };

            fetch('/save_pending_sale/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(saleData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Failed to submit sale');
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    alert('Sale submitted for approval. Invoice: ' + data.invoice_number);
                    cart = [];
                    document.getElementById('customerSelect').value = '';
                    document.getElementById('discountInput').value = '0';
                    document.getElementById('lessInput').value = '0';
                    document.getElementById('paymentInput').value = '0';
                    renderCart();
                } else {
                    alert('Error: ' + (data.error || 'Unknown error occurred'));
                }
            })
            .catch(error => {
                alert('Error submitting sale: ' + error.message);
            });
        }

        // CSRF token function
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
